name: CI/CD PachangApp

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  test-backend:
    name: Tests del Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compilar Backend
        run: mvn package -DskipTests -f backend/pom.xml

  build-and-push-images:
    name: Construir y subir imágenes Docker
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend (Multi-Arch AMD64/ARM64)
        run: |
          cd backend && mvn package -DskipTests
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ secrets.DOCKERHUB_USERNAME }}/pachangapp-backend:latest --push .

      - name: Build & Push Frontend (Multi-Arch AMD64/ARM64)
        run: |
          cd frontend
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ secrets.DOCKERHUB_USERNAME }}/pachangapp-frontend:latest --push .

  deploy-to-server:
    name: Desplegar en Servidor (Kubernetes)
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar en el servidor via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/pachangapp-core
            git fetch origin
            git checkout main
            git pull origin main
            sudo kubectl apply -f k8s/
            sudo kubectl rollout restart deployment/backend
            sudo kubectl rollout restart deployment/frontend

