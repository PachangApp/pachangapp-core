server {
    listen 80;
    server_name pachangapp.es www.pachangapp.es;

    root /usr/share/nginx/html;
    index index.html;

    # Redirección o fuerza HTTPS si está detrás de proxy / SSL
    # (Si Nginx maneja el certificado SSL directamente, descomentar bloque 443)

    # Cabeceras de Seguridad HTTP para Máxima Protección y Certificación SSL
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Compresión Gzip para Carga Ultra Rápida (Mejora SEO de velocidad)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache de assets estáticos (Imágenes, Fuentes, JS, CSS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Soporte para React Single Page Application (SPA Routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
