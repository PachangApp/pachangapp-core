spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/pachangapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

server.port=8091

# JWT Config
pachangapp.app.jwtSecret=pachangappSecretKeyWhichMustBeAtLeast256BitsLongForHmacSha256
pachangapp.app.jwtExpirationMs=86400000
pachangapp.app.baseUrl=${PACHANGAPP_APP_BASEURL:https://api.pachangapp.es}
pachangapp.app.frontendUrl=${PACHANGAPP_APP_FRONTENDURL:https://pachangapp.es}

# AI Config (Compatible con OpenAI, Groq, OpenRouter, etc.)
pachangapp.ai.url=https://api.openai.com/v1/chat/completions
pachangapp.ai.key=${PACHANGAPP_AI_KEY:}
pachangapp.ai.model=gpt-4o-mini

# Email Config (Gmail SMTPS por Puerto 465 SSL para evadir bloqueos de cortafuegos en Render)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:dev.ibrahim.ma@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:zrrckqjwqxyattnw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# File Config
pachangapp.app.uploadDir=uploads

# External APIs
pachangapp.app.weatherApiKey=TU_API_KEY_AQUI
pachangapp.app.openaiApiKey=TU_OPENAI_KEY_AQUI
pachangapp.app.googleClientId=${GOOGLE_CLIENT_ID:122743154815-a3671tmi1m6cg41mg0if37kqujnk3a1k.apps.googleusercontent.com}

# Multipart Config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 Config (for persistent photos)
aws.s3.bucket.name=pachangapp-fotos
aws.access.key=
aws.secret.key=
aws.session.token=
aws.region=us-east-1

